<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Stats</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --primary: #0EA5E9;
    --secondary: #38BDF8;
    --cta: #F97316;
    --background: #F0F9FF;
    --text: #0C4A6E;
    --text-muted: #475569;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--background) 0%, #E0F2FE 100%);
    font-family: 'Work Sans', sans-serif;
    color: var(--text);
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: clamp(2.25rem, 6vw, 3.5rem);
    margin: 0 0 48px;
    color: var(--text);
    opacity: 0;
    transform: translateY(-40px) scale(0.9);
    animation: bounceIn 1s cubic-bezier(0.28, 1.4, 0.55, 1) 0.15s forwards;
  }

  h1 span {
    color: var(--primary);
  }

  @keyframes bounceIn {
    0%   { opacity: 0; transform: translateY(-60px) scale(0.85); }
    45%  { opacity: 1; transform: translateY(12px) scale(1.03); }
    65%  { transform: translateY(-8px) scale(0.99); }
    80%  { transform: translateY(4px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .counter-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.05s forwards;
  }

  .counter {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 10vw, 5rem);
    line-height: 1;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }

  .counter-suffix {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    color: var(--cta);
  }

  .counter-label {
    margin: 8px 0 40px;
    color: var(--text-muted);
    font-size: 1rem;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.2s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .progress-section {
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.35s forwards;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .progress-percent {
    color: var(--primary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    height: 12px;
    width: 100%;
    background: #DBEAFE;
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(12, 74, 110, 0.1);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s;
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .counter-wrap, .counter-label, .progress-section {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .progress-fill {
      transition: none !important;
    }
  }
</style>
</head>
<body>

<main>
  <h1>Nos résultats en <span>chiffres</span></h1>

  <div class="counter-wrap">
    <span class="counter" id="counter">0</span><span class="counter-suffix">+</span>
  </div>
  <p class="counter-label">clients satisfaits</p>

  <section class="progress-section">
    <div class="progress-header">
      <span>Objectif atteint</span>
      <span class="progress-percent" id="progress-percent">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </section>
</main>

<script>
  (function () {
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var counterEl = document.getElementById('counter');
    var progressFillEl = document.getElementById('progress-fill');
    var progressPercentEl = document.getElementById('progress-percent');

    var COUNTER_TARGET = 2500;
    var PROGRESS_TARGET = 87;
    var START_DELAY = prefersReducedMotion ? 0 : 1100;
    var DURATION = prefersReducedMotion ? 0 : 1600;

    function animateCount(el, target, duration) {
      if (duration === 0) {
        el.textContent = target.toLocaleString('fr-FR');
        return;
      }
      var startTime = null;
      function easeOutExpo(t) {
        return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
      }
      function step(timestamp) {
        if (startTime === null) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var eased = easeOutExpo(progress);
        el.textContent = Math.round(eased * target).toLocaleString('fr-FR');
        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    function animateProgressLabel(el, target, duration) {
      if (duration === 0) {
        el.textContent = target + '%';
        return;
      }
      var startTime = null;
      function step(timestamp) {
        if (startTime === null) startTime = timestamp;
        var progress = Math.min((timestamp - startTime) / duration, 1);
        el.textContent = Math.round(progress * target) + '%';
        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    setTimeout(function () {
      animateCount(counterEl, COUNTER_TARGET, DURATION);
    }, START_DELAY);

    setTimeout(function () {
      progressFillEl.style.width = PROGRESS_TARGET + '%';
      animateProgressLabel(progressPercentEl, PROGRESS_TARGET, DURATION);
    }, START_DELAY + 400);
  })();
</script>

</body>
</html>
